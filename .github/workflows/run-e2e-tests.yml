name: Run end-to-end tests

permissions:
  contents: read

# On demand from the default branch only. These tests create fixtures in
# shared live sandboxes (one Jira project, one Confluence space, one Bitbucket
# workspace, one Trello account, one Sentry org), so running them per pull
# request would let concurrent runs collide, and fork PRs cannot get the OIDC
# token they need for the sandbox credentials. The default-branch gate also
# keeps a manual dispatch of an untrusted ref from running repository code
# with those credentials.
#
# The plugins under test are the latest published @hesed/* releases from npm
# (E2E_PLUGIN_SOURCE=npm), so this proves the host against what users actually
# get — not unreleased sibling-repo HEADs. The mysql/psql Docker fixtures are
# vendored in this repo under test/e2e/docker/.
#
# The sandbox credentials come from the Infisical project in .infisical.json
# (`dev` environment), fetched over GitHub OIDC. Blocked until the repository
# variables INFISICAL_IDENTITY_ID and INFISICAL_PROJECT_SLUG are set and the
# machine identity's OIDC auth allows this repo.
on:
  workflow_dispatch:

# Scoped to the ref: a dispatch from another branch skips every job, and in a
# shared group it would still replace a pending default-branch run.
concurrency:
  group: sdkck-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that installs or builds runs here, with no OIDC permission: a
  # compromised `npm ci` or plugin-install lifecycle script can neither read
  # the sandbox credentials nor request a token to fetch them itself.
  build:
    name: Build sdkck and install the plugins
    # The test and sweep jobs need this one, so they are skipped with it.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # Pinned to a full SHA: these actions run before repository code gets
        # the credentials, so a moved mutable tag could swap what executes.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          # Nothing here pushes, and the default would leave GITHUB_TOKEN in
          # the workspace git config for every later step to reuse.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # Builds sdkck and installs @hesed/<plugin>@latest from npm into the
      # sdkck home the test job reuses — the install half of
      # `npm run test:e2e`.
      - name: Build sdkck and install the plugins
        run: npm run test:e2e -- --setup-only
        env:
          E2E_PLUGIN_SOURCE: npm
          E2E_SDKCK_HOME: ${{ runner.temp }}/sdkck-home

      # Only the build outputs travel: the jobs that hold the credentials check
      # out the repository themselves, so a lifecycle script that edits or
      # adds a source, test or script file here cannot get it run there.
      # node_modules and the installed plugins are still installed code — the
      # tests cannot run without them — so this narrows, not removes, that
      # trust. A tarball rather than the artifact's own zip, which drops
      # executable bits and node_modules/.bin symlinks. Absolute paths are kept
      # because the plugin install records them, and hosted runners share one
      # layout.
      - name: Pack the build outputs and sdkck home
        run: |
          tar -czf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"

      - name: Upload the workspace
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}/e2e-workspace.tgz
          retention-days: 1

  run-e2e-tests:
    name: Host end-to-end tests against the live sandboxes
    needs: build
    runs-on: ubuntu-latest
    # The suite step's 25 minutes plus up to 10 minutes of setup (checkout,
    # unpack, the credential fetch).
    timeout-minutes: 35
    # id-token lets the Infisical action exchange GitHub's OIDC token for the
    # sandbox credentials, so no Infisical secret is stored in the repo. Only
    # this job and the sweep have it, and nothing in either installs packages.
    permissions:
      contents: read
      id-token: write
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      # A fresh checkout of the dispatched commit, not the build job's copy:
      # see "Pack the build outputs and sdkck home".
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}

      # Extracts only the named members, so nothing else in the archive can
      # land over the checkout.
      - name: Unpack the build outputs and sdkck home
        run: |
          tar -xzf "$RUNNER_TEMP/e2e-workspace.tgz" -C / \
            "${GITHUB_WORKSPACE#/}/node_modules" "${GITHUB_WORKSPACE#/}/dist" \
            "${RUNNER_TEMP#/}/sdkck-home"
          echo "E2E_SDKCK_HOME=$RUNNER_TEMP/sdkck-home" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      # The Infisical action exports the sandbox credentials to $GITHUB_ENV,
      # so every later step sees them; the steps before it never do.
      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      # Starts the mysql/psql containers (built from the vendored Dockerfiles,
      # which run no install steps), runs mocha, sweeps fixtures from its EXIT
      # trap, and tears the containers down. A step-level timeout, not just
      # the job's, so a hung run still fails with the job's later steps run;
      # the job-level timeout stays as the outer backstop.
      - name: Run end-to-end tests
        timeout-minutes: 25
        run: npm run test:e2e -- --skip-setup

  # A separate job, not a step with `if: always()`: a job cancelled by its
  # timeout-minutes never starts its remaining steps, so an in-job fallback
  # sweep would be skipped in exactly the scenario it exists for. A dependent
  # job with `if: always()` still runs when the test job fails, times out, or
  # is cancelled — only a failed or skipped build has nothing to reclaim, since
  # no test ran. E2E_RUN_ID is derivable in any job of the same workflow run,
  # which is what lets this sweep delete the test job's fixtures, not just the
  # ones older than an hour. It reuses the build job's node_modules, so it
  # installs nothing while holding id-token.
  sweep-fixtures:
    name: Sweep leftover fixtures
    runs-on: ubuntu-latest
    needs: [build, run-e2e-tests]
    if: always() && needs.build.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh checkout of the dispatched commit, not the build job's copy:
      # see "Pack the build outputs and sdkck home".
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download the build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-workspace
          path: ${{ runner.temp }}

      # The sweep runs from source via ts-node, so it needs node_modules only.
      - name: Unpack node_modules
        run: tar -xzf "$RUNNER_TEMP/e2e-workspace.tgz" -C / "${GITHUB_WORKSPACE#/}/node_modules"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Fetch sandbox credentials from Infisical
        uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: dev

      # Deletes this run's labelled fixtures (E2E_RUN_ID) and any older than
      # an hour.
      - name: Sweep leftover fixtures
        run: npm run e2e:sweep
        env:
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
